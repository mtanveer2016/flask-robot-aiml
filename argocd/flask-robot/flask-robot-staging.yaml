apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-robot-staging
  namespace: argocd
spec:
  destination:
    namespace: staging
    server: https://kubernetes.default.svc
  project: default
  source:
    path: helm
    repoURL: https://github.com/mtanveer2016/flask-robot
    targetRevision: main
    helm:
      valueFiles:
        - values-staging.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
