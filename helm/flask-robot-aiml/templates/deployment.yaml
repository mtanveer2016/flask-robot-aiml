apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-robot-aiml-flask-robot-aiml
  namespace: staging
  labels:
    app: flask-robot-aiml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-robot-aiml
  template:
    metadata:
      labels:
        app: flask-robot-aiml
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
      - name: flask-robot-aiml
        image: 82mtanveer/myrepo:flask-robot-arm64-final
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5002
        securityContext:
          privileged: true
          capabilities:
            add:
            - ALL
        env:
        - name: ENVIRONMENT
          value: "staging"
        - name: LG_ADDR
          value: "localhost"
        - name: LG_PORT
          value: "8889"
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        volumeMounts:
        - name: dev-gpiomem
          mountPath: /dev/gpiomem0
        - name: dev-i2c
          mountPath: /dev/i2c-1
        - name: dev-mem
          mountPath: /dev/mem
      volumes:
      - name: dev-gpiomem
        hostPath:
          path: /dev/gpiomem0
          type: CharDevice
      - name: dev-i2c
        hostPath:
          path: /dev/i2c-1
          type: CharDevice
      - name: dev-mem
        hostPath:
          path: /dev/mem
          type: CharDevice
