apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-robot-aiml
  namespace: staging
  labels:
    app: flask-robot-aiml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-robot-aiml
  template:
    metadata:
      labels:
        app: flask-robot-aiml
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
      - name: flask-robot-aiml
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 5002
        securityContext:
          privileged: true
          capabilities:
            add:
            - ALL
        env:
        - name: ENVIRONMENT
          value: "staging"
        - name: LG_ADDR
          value: "localhost"
        - name: LG_PORT
          value: "8889"
# ───────── ADD THIS ─────────
#        - name: LD_LIBRARY_PATH
#          value: "/root/whisper.cpp/build/bin:/usr/local/lib"
# ────────────────────────────
        resources:
          requests:
            memory: "512Mi"
            cpu: "512m"
          limits:
            memory: "2Gi"
            cpu: "4000m"
        volumeMounts:
        - name: dev-gpiomem
          mountPath: /dev/gpiomem0
        - name: dev-i2c
          mountPath: /dev/i2c-1
        - name: dev-mem
          mountPath: /dev/mem
# Whisper.cpp from host
        - name: whisper-cpp
          mountPath: /root/whisper.cpp
          readOnly: true
# Piper TTS from host
        - name: piper
          mountPath: /app/models/piper
          readOnly: true
      volumes:
      - name: dev-gpiomem
        hostPath:
          path: /dev/gpiomem0
          type: CharDevice
      - name: dev-i2c
        hostPath:
          path: /dev/i2c-1
          type: CharDevice
      - name: dev-mem
        hostPath:
          path: /dev/mem
          type: CharDevice
# Whisper.cpp volume
      - name: whisper-cpp
        hostPath:
          path: /home/aiml/whisper.cpp
          type: Directory
# Piper TTS volume
      - name: piper
        hostPath:
          path: /home/aiml/piper
          type: Directory
