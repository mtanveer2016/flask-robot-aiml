apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-robot-aiml
  namespace: staging
  labels:
    app: flask-robot-aiml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-robot-aiml
  template:
    metadata:
      labels:
        app: flask-robot-aiml
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
      - name: flask-robot-aiml
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 5002
        securityContext:
          privileged: true
          capabilities:
            add:
            - ALL
        env:
        - name: ENVIRONMENT
          value: "staging"
        - name: LG_ADDR
          value: "localhost"
        - name: LG_PORT
          value: "8889"
# ───────── ADD THIS ─────────
#        - name: LD_LIBRARY_PATH
#          value: "/root/whisper.cpp/build/bin:/usr/local/lib"
# ────────────────────────────
        resources:
          requests:
            memory: "512Mi"
            cpu: "512m"
          limits:
            memory: "2Gi"
            cpu: "4000m"
        volumeMounts:
        - name: dev-gpiomem
          mountPath: /dev/gpiomem0
        - name: dev-i2c
          mountPath: /dev/i2c-1
        - name: dev-mem
          mountPath: /dev/mem
# Whisper.cpp from host
        - name: whisper-cpp
          mountPath: /root/whisper.cpp
          readOnly: true
# Piper TTS from host
        - name: piper
          mountPath: /app/models/piper
          readOnly: true
        # ============ CAMERA ============
        # rp1-cfe (CSI camera)
        - name: dev-video0
          mountPath: /dev/video0
        - name: dev-video1
          mountPath: /dev/video1
        - name: dev-video2
          mountPath: /dev/video2
        - name: dev-video3
          mountPath: /dev/video3
        - name: dev-video4
          mountPath: /dev/video4
        - name: dev-video5
          mountPath: /dev/video5
        - name: dev-video6
          mountPath: /dev/video6
        - name: dev-video7
          mountPath: /dev/video7
        - name: dev-media0
          mountPath: /dev/media0
        # pispbe (ISP backend)
        - name: dev-video20
          mountPath: /dev/video20
        - name: dev-video21
          mountPath: /dev/video21
        - name: dev-video22
          mountPath: /dev/video22
        - name: dev-video23
          mountPath: /dev/video23
        - name: dev-video24
          mountPath: /dev/video24
        - name: dev-video25
          mountPath: /dev/video25
        - name: dev-video26
          mountPath: /dev/video26
        - name: dev-video27
          mountPath: /dev/video27
        - name: dev-video28
          mountPath: /dev/video28
        - name: dev-video29
          mountPath: /dev/video29
        - name: dev-video30
          mountPath: /dev/video30
        - name: dev-video31
          mountPath: /dev/video31
        - name: dev-video32
          mountPath: /dev/video32
        - name: dev-video33
          mountPath: /dev/video33
        - name: dev-video34
          mountPath: /dev/video34
        - name: dev-video35
          mountPath: /dev/video35
        - name: dev-media1
          mountPath: /dev/media1
        - name: dev-media2
          mountPath: /dev/media2
        # rpi-hevc-dec
        - name: dev-video19
          mountPath: /dev/video19
        - name: dev-media3
          mountPath: /dev/media3
        # =======================
      volumes:
      - name: dev-gpiomem
        hostPath:
          path: /dev/gpiomem0
          type: CharDevice
      - name: dev-i2c
        hostPath:
          path: /dev/i2c-1
          type: CharDevice
      - name: dev-mem
        hostPath:
          path: /dev/mem
          type: CharDevice
# Whisper.cpp volume
      - name: whisper-cpp
        hostPath:
          path: /home/aiml/whisper.cpp
          type: Directory
# Piper TTS volume
      - name: piper
        hostPath:
          path: /home/aiml/piper
          type: Directory
      # ============ CAMERA ============
      - name: dev-video0
        hostPath:
          path: /dev/video0
          type: CharDevice
      - name: dev-video1
        hostPath:
          path: /dev/video1
          type: CharDevice
