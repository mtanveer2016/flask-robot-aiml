apiVersion: v1
kind: Service
metadata:
  name: {{ include "flask-robot-aiml.fullname" . }}
  labels:
    app: flask-robot-aiml
spec:
  type: {{ .Values.service.type }}
  selector:
    app: flask-robot-aiml
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
    nodePort: {{ .Values.service.nodePort }}
