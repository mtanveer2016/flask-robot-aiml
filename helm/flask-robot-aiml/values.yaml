
replicaCount: 1

image:
  repository: 82mtanveer/flask-robot-ai-agent
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 5002
  nodePort: 32392

env:
  ENVIRONMENT: staging
  LG_ADDR: localhost
  LG_PORT: 8889

resources:
  requests:
    memory: "512Mi"
    cpu: "512m"
  limits:
    memory: "2Gi"
    cpu: "4000m"
