apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: flask-robot
  name: flask-robot
  namespace: {{ .Values.namespace.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: flask-robot
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: flask-robot
    spec:
      containers:
        - name: flask-robot
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ports.containerPort }}
              protocol: {{ .Values.ports.protocol }}
              name: http
          env:
            - name: ENVIRONMENT
              value: {{ .Values.environment | default "staging" }}
            - name: PIGPIO_ADDR
              value: {{ .Values.env.PIGPIO_ADDR | default "10.226.22.234" }}
            - name: PIGPIO_PORT
              value: {{ .Values.env.PIGPIO_PORT | default "8889" | quote }}
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu }}
          securityContext:
            privileged: {{ .Values.securityContext.privileged | default false }}
          volumeMounts:
            {{- toYaml .Values.volumeMounts | nindent 12 }}
      volumes:
        {{- toYaml .Values.volumes | nindent 8 }}
