apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flask-robot-ingress
  namespace: staging
spec:
  rules:
  - host: mtrobotcar.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flask-robot
            port:
              number: 5002
