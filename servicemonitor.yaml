apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flask-robot-monitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack  # ← CHANGED: Matches Prometheus selector
spec:
  selector:
    matchLabels:
      app: flask-robot              # ← CHANGED: Removed release: prometheus
  namespaceSelector:
    matchNames:
      - staging
  endpoints:
    - port: http
      interval: 30s
      path: /metrics
